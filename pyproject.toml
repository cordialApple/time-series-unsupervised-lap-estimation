[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lap-estimation"
version = "0.1.0"
description = "Reproducible Formula SAE telemetry experiments for lap estimation and segmentation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Brandon Randle" }]
keywords = ["telemetry", "time-series", "signal-processing", "machine-learning", "formula-sae"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "matplotlib==3.11.2",
  "numpy==2.5.3",
  "pandas==3.0.5",
  "scikit-learn==1.9.1",
  "scipy==1.18.1",
  "seaborn==0.13.2",
  "torch==2.14.0",
]

[project.optional-dependencies]
notebooks = [
  "ipykernel==7.3.0",
  "jupyterlab==4.6.3",
]

[tool.setuptools]
packages = ["lap_estimation"]
